name: Proponer una app · Propose an app
description: Sugiere una app homebrew para el catálogo · Suggest a homebrew app for the catalog (solo el enlace · just the link).
title: "Proponer · Propose: "
labels: ["propuesta"]
body:
  - type: input
    id: enlace
    attributes:
      label: Enlace de GitHub de la app · App's GitHub link
      placeholder: https://github.com/autor/app
    validations:
      required: true
  - type: textarea
    id: comentario
    attributes:
      label: ¿Algo que debamos saber? · Anything we should know? (opcional · optional)
      description: Para qué la usas, si necesita otra app, en qué firmware la has probado… · What you use it for, whether it needs another app, which firmware you tested it on…
  - type: checkboxes
    id: limites
    attributes:
      label: Antes de enviar · Before sending
      options:
        - label: Es homebrew para PS5 que funciona con la consola ya en modo homebrew. · It's PS5 homebrew that runs on a console already in homebrew mode.
          required: true
        - label: No es un exploit ni una herramienta de jailbreak, ni sirve para piratería o para saltarse DRM, licencias o cuentas. · It's not an exploit or a jailbreak tool, and it's not for piracy or for bypassing DRM, licenses or accounts.
          required: true
        - label: El repo es público y tiene al menos una release con ficheros. · The repo is public and has at least one release with files.
          required: true
